[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcontract"
dynamic = ["version"]
description = "Executable contracts for ML systems — validate data, models and predictions before they break production."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Pranav Bansode", email = "hawkeyes1818@gmail.com" }]
maintainers = [{ name = "Pranav Bansode", email = "hawkeyes1818@gmail.com" }]
keywords = [
    "machine-learning",
    "data-contract",
    "data-validation",
    "schema",
    "mlops",
    "contract-testing",
    "breaking-changes",
    "data-quality",
    "ci-cd",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# The core has no required runtime dependencies. Contracts are defined, validated,
# serialized to JSON and diffed using the standard library alone. Every heavier
# capability is an extra.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
pandas = ["pandas>=1.5"]
all = ["mlcontract[yaml,pandas]"]

test = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]
lint = ["ruff>=0.6", "mypy>=1.11"]
# mkdocs is pinned below 2.0 deliberately. The 2.0 release removes the plugin
# system and theming with no migration path, which would break this site and
# mkdocstrings with it. Revisit once the ecosystem has settled.
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
dev = ["mlcontract[all,test,lint,docs]", "build>=1.2", "twine>=5.1", "pre-commit>=3.7"]

[project.scripts]
mlcontract = "mlcontract.cli.main:run"

[project.urls]
Homepage = "https://github.com/AratameX/mlcontract"
Repository = "https://github.com/AratameX/mlcontract"
Documentation = "https://github.com/AratameX/mlcontract#readme"
Changelog = "https://github.com/AratameX/mlcontract/blob/main/CHANGELOG.md"
Issues = "https://github.com/AratameX/mlcontract/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "mlcontract._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mlcontract = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "pandas: requires the optional pandas extra",
    "yaml: requires the optional yaml extra",
    "slow: excluded from the default fast feedback loop",
]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Test functions are exempt from *declaring* annotations — `-> None` on several
# hundred test cases is noise. Their bodies are still fully type-checked, so a
# genuine type error in a test still fails CI.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "yaml.*", "pandera.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "D",        # pydocstyle
    "ANN",      # flake8-annotations
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "TID",      # flake8-tidy-imports
]
ignore = [
    "ANN401",  # Any in signatures: contract documents are arbitrary JSON, and
               # pretending otherwise would mean lying in the annotations.
    "D107",  # __init__ docstring — covered by the class docstring
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Test names are the documentation; requiring docstrings on every test class and
# method adds noise without adding information.
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "D106", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
branch = true
source = ["mlcontract"]
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "class .*\\(Protocol\\):",
]
