name: Feature request
description: Suggest something the library should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The most useful requests describe a problem you hit, not only a solution
        you have in mind — the problem often has a better answer than the one
        that first comes to mind.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: What were you doing when you wanted this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, other libraries, or why the existing API does not fit.

  - type: dropdown
    id: scope
    attributes:
      label: Which part does this touch
      options:
        - Contracts and constraints
        - Validation and reports
        - Diff and compatibility
        - Command line
        - A new data backend
        - Documentation
        - Something else
    validations:
      required: true
