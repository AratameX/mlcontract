name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi]

# No repository secrets anywhere in this file. Publishing uses PyPI's Trusted
# Publishing: GitHub mints a short-lived OIDC token for this specific workflow,
# and PyPI verifies it against a publisher you registered. There is no long-lived
# API token that can leak, be committed by accident, or outlive its usefulness.
permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the package version
        id: version
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          VERSION=$(python -c "import schemapact; print(schemapact.__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Check the tag matches the package version
        # A tag saying v0.1.0 on a package that reports 0.1.0.dev0 would publish
        # the wrong thing under the right name, and a PyPI release cannot be
        # replaced afterwards. Catching it here costs seconds; catching it later
        # costs a version number.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match package version $VERSION."
            exit 1
          fi
          echo "Tag and package version agree: $VERSION"

      - name: Build
        run: |
          pip install build twine
          python -m build

      - name: Verify the distributions
        run: |
          python -m twine check --strict dist/*
          ls -lh dist/

      - name: Confirm py.typed ships in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "schemapact/py.typed" in names, "py.typed missing from the wheel"
          print("py.typed present")
          PY

      - name: Confirm the core install pulls in nothing
        # The dependency-free core is a promise made on the README and the PyPI
        # page. Verify it against the artifact actually about to be published,
        # not against the repository.
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --upgrade pip --quiet
          /tmp/bare/bin/pip install --quiet dist/*.whl
          INSTALLED=$(/tmp/bare/bin/pip list --format=freeze | grep -viE "^(pip|setuptools|wheel|schemapact)=" || true)
          if [ -n "$INSTALLED" ]; then
            echo "::error::The core install pulled in dependencies:"
            echo "$INSTALLED"
            exit 1
          fi
          echo "Core install is dependency-free."

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/schemapact
    permissions:
      id-token: write   # required to mint the OIDC token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI accumulates junk from everyone's dry runs, and a version
          # already uploaded there should not fail a real release.
          skip-existing: true

  verify-testpypi:
    name: Install from TestPyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install from TestPyPI and smoke test
        # The real check: does the published artifact work for someone who runs
        # pip install? Dependencies come from real PyPI, since TestPyPI does not
        # mirror them.
        run: |
          for attempt in 1 2 3; do
            sleep 20
            pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "schemapact==${{ needs.build.outputs.version }}" && break
            echo "::warning::Not indexed yet; retrying ($attempt/3)"
          done

          python -c "
          import schemapact
          from schemapact import Contract, DType, Feature
          print('version:', schemapact.__version__)
          c = Contract(name='t', version='1.0.0',
                       features=[Feature('age', DType.INTEGER, min=18)])
          report = c.validate([{'age': 30}, {'age': 12}])
          assert not report.is_valid
          assert 'SPX203' in report.codes()
          print('validation works')
          "
          schemapact version

  pypi:
    name: Publish to PyPI
    # Only ever from a tag, and only after the same artifact has been installed
    # from TestPyPI and shown to work. A PyPI version number can never be reused,
    # so there is no undo behind this step.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, testpypi, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/schemapact
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    name: Install from PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the published release
        run: |
          for attempt in 1 2 3; do
            sleep 30
            pip install "schemapact==${{ needs.build.outputs.version }}" && break
            echo "::warning::Not indexed yet; retrying ($attempt/3)"
          done
          python -c "import schemapact; print('published:', schemapact.__version__)"
          schemapact version

      - name: Confirm the extras install
        run: |
          pip install "schemapact[all]==${{ needs.build.outputs.version }}"
          python -c "
          import pandas as pd
          from schemapact import Contract, DType, Feature
          c = Contract(name='t', version='1.0.0',
                       features=[Feature('a', DType.INTEGER, min=0)])
          assert not c.validate(pd.DataFrame({'a': [-1]})).is_valid
          print('pandas extra works')
          "

  release:
    name: Create the GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, pypi, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - name: Extract this version's changelog entry
        id: notes
        run: |
          python - <<'PY' > notes.md
          import os, re, pathlib
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Everything between this version's heading and the next one.
          match = re.search(
              rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          print(match.group(1).strip() if match else "See CHANGELOG.md.")
          PY
        env:
          VERSION: ${{ needs.build.outputs.version }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes-file notes.md \
            dist/*
