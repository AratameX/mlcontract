name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint,test]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check --diff .

      - name: Mypy (strict)
        run: mypy

  test:
    # Two dependency shapes, not one. "core" installs no optional extras and is
    # what proves the dependency-free core is real rather than aspirational —
    # if a stray `import yaml` ever reaches the core, this job fails. "full"
    # exercises the code paths that only exist when extras are present.
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.extras }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The full Python matrix runs on Linux. macOS and Windows get a single
        # version each, because the bugs they catch are about paths, encodings
        # and line endings rather than language versions — and running the whole
        # grid on three operating systems costs far more than it finds.
        #
        # This is not hypothetical. A byte-order-mark bug that corrupted the
        # first column of any CSV written by Excel or PowerShell survived five
        # phases of green Linux CI and was found by running the tool by hand on
        # Windows.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        extras: [core, full]
        include:
          - os: windows-latest
            python-version: "3.12"
            extras: full
          - os: macos-latest
            python-version: "3.12"
            extras: full
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (${{ matrix.extras }})
        # bash on every runner, including Windows, so one script works across
        # the matrix instead of needing a PowerShell variant.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.extras }}" = "core" ]; then
            pip install -e ".[test]"
          else
            pip install -e ".[test,yaml,pandas]"
          fi

      - name: Confirm the core environment really has no optional dependencies
        if: matrix.extras == 'core'
        shell: bash
        run: |
          if pip show PyYAML pandas > /dev/null 2>&1; then
            echo "::error::An optional dependency leaked into the core install."
            pip list
            exit 1
          fi
          echo "Core install confirmed dependency-free."

      - name: Run tests with branch coverage
        shell: bash
        run: |
          pytest --cov=schemapact --cov-branch \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --junitxml=junit-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.extras }}.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.extras }}
          path: junit-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.extras }}.xml
          if-no-files-found: warn

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the full dependency tree
        # Every extra, because a vulnerability in an optional dependency still
        # reaches everyone who installs it.
        #
        # schemapact itself is then uninstalled: pip-audit resolves each
        # installed distribution against PyPI, and an unpublished local build
        # cannot be resolved. Removing it leaves precisely the dependency tree,
        # which is the thing worth auditing.
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]" pip-audit
          pip uninstall -y schemapact

      - name: Audit
        # Fails the build on a known vulnerability. If a finding has no fix
        # available yet, add `--ignore-vuln <ID>` here with a comment saying why,
        # rather than deleting the step.
        #
        # Retried because pip-audit queries PyPI's API once per package, and a
        # single reset connection would otherwise fail the build for reasons
        # unrelated to security. A check that goes red on network weather teaches
        # people to re-run it without reading it.
        run: |
          for attempt in 1 2 3; do
            pip-audit --strict --progress-spinner off && exit 0
            echo "::warning::pip-audit attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::pip-audit failed after 3 attempts"
          exit 1

  build:
    name: Build & verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Twine check
        run: python -m twine check --strict dist/*

      - name: List artifacts
        run: ls -lh dist/

      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --upgrade pip
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/python -c "
          import schemapact
          print('schemapact', schemapact.__version__)
          assert schemapact.__version__
          "

      - name: Smoke test the source distribution in a clean environment
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install --upgrade pip
          /tmp/sdist-env/bin/pip install dist/*.tar.gz
          /tmp/sdist-env/bin/python -c "import schemapact; print(schemapact.__version__)"

      - name: Verify py.typed ships in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "schemapact/py.typed" in names, f"py.typed missing from wheel: {names}"
          print("py.typed present")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
